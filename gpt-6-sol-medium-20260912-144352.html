  <script>
    const scene = document.getElementById('scene');
    const toggle = document.getElementById('toggle');
    const icon = document.getElementById('control-icon');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const frontLeg = document.getElementById('front-leg');
    const backLeg = document.getElementById('back-leg');
    const frontFoot = document.getElementById('front-foot');
    const backFoot = document.getElementById('back-foot');
    const cycleMs = 1250;
    let paused = reducedMotion.matches;
    let elapsed = 0;
    let previousFrame = null;

    function drawLeg(path, foot, hipX, hipY, angle) {
      const ankleX = 615 + 51 * Math.cos(angle);
      const ankleY = 535 + 51 * Math.sin(angle);
      const midX = (hipX + ankleX) / 2 - 16;
      const midY = (hipY + ankleY) / 2 + 19;
      path.setAttribute('d', `M${hipX} ${hipY} Q${midX - 20} ${midY - 22} ${midX} ${midY} L${ankleX} ${ankleY}`);
      foot.setAttribute('d', `M${ankleX - 13} ${ankleY - 8}q18-8 32 4l8 8h-42q-8-1 2-4Z`);
    }

    function frame(now) {
      if (previousFrame !== null && !paused) elapsed += Math.min(now - previousFrame, 64);
      previousFrame = now;
      const angle = elapsed / cycleMs * Math.PI * 2;
      drawLeg(frontLeg, frontFoot, 588, 361, angle);
      drawLeg(backLeg, backFoot, 558, 357, angle + Math.PI);
      requestAnimationFrame(frame);
    }

    function syncControl() {
      scene.classList.toggle('paused', paused);
      toggle.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
      toggle.title = paused ? '播放动画' : '暂停动画';
      icon.setAttribute('d', paused ? 'M8 5l11 7-11 7Z' : 'M8 5v14M16 5v14');
    }

    toggle.addEventListener('click', () => { paused = !paused; syncControl(); });
    reducedMotion.addEventListener('change', event => { paused = event.matches; syncControl(); });
    syncControl();
    requestAnimationFrame(frame);
  </script>
