<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑自行车 - 2D SVG 动画</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(180deg, #38bdf8 0%, #7dd3fc 42%, #bae6fd 75%, #fef08a 100%);
      --sea-grad: linear-gradient(180deg, #0284c7 0%, #0369a1 40%, #075985 100%);
      --ui-bg: rgba(255, 255, 255, 0.88);
      --ui-text: #0f172a;
      --ui-subtext: #475569;
      --ui-border: rgba(255, 255, 255, 0.65);
      --ui-shadow: 0 16px 36px rgba(15, 23, 42, 0.16);
      --accent: #f97316;
      --accent-hover: #ea580c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b1320;
      transition: background 1s ease;
    }

    /* 舞台主视口包装容器 */
    .stage-wrapper {
      position: relative;
      width: 96vw;
      max-width: 1280px;
      height: 88vh;
      max-height: 720px;
      border-radius: 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.15);
      overflow: hidden;
      background: var(--bg-gradient);
      transition: background 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    svg#stage {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* 顶部信息面板 */
    .top-header {
      position: absolute;
      top: 18px;
      left: 24px;
      right: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      z-index: 20;
    }

    .brand-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      background: var(--ui-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 999px;
      border: 1px solid var(--ui-border);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      color: var(--ui-text);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.3px;
      pointer-events: auto;
      transition: all 0.3s ease;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulseGreen 1.8s infinite ease-in-out;
    }

    @keyframes pulseGreen {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.65; }
    }

    .telemetry-badge {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 18px;
      background: var(--ui-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 999px;
      border: 1px solid var(--ui-border);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      color: var(--ui-text);
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      pointer-events: auto;
    }

    .telemetry-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .telemetry-val {
      font-weight: 800;
      color: var(--accent);
    }

    /* 鹈鹕俏皮对白气泡 */
    .speech-bubble {
      position: absolute;
      top: 105px;
      left: 630px;
      background: #ffffff;
      color: #0f172a;
      font-weight: 800;
      font-size: 14px;
      padding: 8px 16px;
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
      pointer-events: none;
      opacity: 0;
      transform: scale(0.6) translateY(10px);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 30;
      white-space: nowrap;
    }

    .speech-bubble.active {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .speech-bubble::after {
      content: "";
      position: absolute;
      bottom: -7px;
      left: 22px;
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: #ffffff transparent;
      display: block;
      width: 0;
    }

    /* 底部控制 Dock */
    .control-dock {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 20px;
      background: var(--ui-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 48px;
      border: 1px solid var(--ui-border);
      box-shadow: var(--ui-shadow);
      z-index: 30;
      max-width: 95%;
      flex-wrap: wrap;
      justify-content: center;
      transition: all 0.4s ease;
    }

    .dock-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dock-divider {
      width: 1px;
      height: 24px;
      background: rgba(100, 116, 139, 0.25);
      margin: 0 4px;
    }

    .ctrl-btn {
      appearance: none;
      border: none;
      outline: none;
      background: rgba(241, 245, 249, 0.9);
      color: #334155;
      padding: 8px 14px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
    }

    .ctrl-btn:hover {
      transform: translateY(-2px) scale(1.03);
      background: #ffffff;
      color: #0f172a;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.1);
    }

    .ctrl-btn:active {
      transform: translateY(1px) scale(0.97);
    }

    .ctrl-btn.active {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.38);
    }

    /* 快捷键标记 */
    .key-tip {
      font-size: 10px;
      padding: 2px 5px;
      background: rgba(0, 0, 0, 0.08);
      border-radius: 4px;
      opacity: 0.75;
    }

    /* 车速滑块 */
    .speed-control {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ui-text);
      padding: 0 4px;
    }

    .speed-control input[type="range"] {
      appearance: none;
      -webkit-appearance: none;
      width: 96px;
      height: 6px;
      background: #cbd5e1;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    .speed-control input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(249, 115, 22, 0.5);
      transition: transform 0.15s;
    }

    .speed-control input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }

    /* 冲刺加速闪烁标志 */
    .sprint-flair {
      display: none;
      color: #ef4444;
      font-weight: 800;
      font-size: 11px;
      animation: flash 0.3s infinite alternate;
    }

    @keyframes flash {
      from { opacity: 0.4; } to { opacity: 1; }
    }

    /* 昼夜主题 */
    body.theme-sunset {
      --bg-gradient: linear-gradient(180deg, #4a1d63 0%, #9333ea 30%, #f43f5e 65%, #fde047 100%);
      --ui-bg: rgba(45, 20, 55, 0.88);
      --ui-text: #fef08a;
      --ui-border: rgba(254, 240, 138, 0.2);
    }
    body.theme-sunset .ctrl-btn {
      background: rgba(88, 28, 110, 0.7);
      color: #fce7f3;
    }
    body.theme-sunset .ctrl-btn:hover {
      background: rgba(112, 36, 140, 0.95);
      color: #ffffff;
    }

    body.theme-night {
      --bg-gradient: linear-gradient(180deg, #030712 0%, #0f172a 45%, #1e293b 80%, #334155 100%);
      --ui-bg: rgba(15, 23, 42, 0.9);
      --ui-text: #f8fafc;
      --ui-subtext: #94a3b8;
      --ui-border: rgba(255, 255, 255, 0.12);
      --ui-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
    }
    body.theme-night .ctrl-btn {
      background: rgba(30, 41, 59, 0.85);
      color: #e2e8f0;
    }
    body.theme-night .ctrl-btn:hover {
      background: #334155;
      color: #ffffff;
    }
    body.theme-night .key-tip {
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body class="theme-day">

  <div class="stage-wrapper">
    <!-- 顶部状态栏 -->
    <div class="top-header">
      <div class="brand-badge">
        <div class="status-dot"></div>
        <span>Pelican Grand Tour 🚴 滨海巡游记</span>
      </div>

      <div class="telemetry-badge">
        <div class="telemetry-item">
          <span>速度:</span>
          <span id="speedKmh" class="telemetry-val">24.5</span>
          <span>km/h</span>
        </div>
        <div class="telemetry-item">
          <span>踏频:</span>
          <span id="cadenceRpm" class="telemetry-val">82</span>
          <span>RPM</span>
        </div>
        <div class="telemetry-item">
          <span>里程:</span>
          <span id="distanceKm" class="telemetry-val">3.8</span>
          <span>km</span>
        </div>
      </div>
    </div>

    <!-- 鹈鹕诙谐对白气泡 -->
    <div id="speechBubble" class="speech-bubble">呱！今天海风正好，冲呀！🐟💨</div>

    <!-- 主画布 SVG (1280 x 720) -->
    <svg id="stage" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
      <defs>
        <!-- 柔和阴影与辉光 -->
        <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="8" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.25" flood-color="#050811" />
        </filter>

        <!-- 海洋水体渐变 -->
        <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#0284c7" />
          <stop offset="50%" stop-color="#0369a1" />
          <stop offset="100%" stop-color="#0c4a6e" />
        </linearGradient>

        <!-- 经典英国赛车绿金属车架渐变 -->
        <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#059669" />
          <stop offset="45%" stop-color="#047857" />
          <stop offset="100%" stop-color="#064e3b" />
        </linearGradient>

        <!-- 镀铬高光渐变 -->
        <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="35%" stop-color="#e2e8f0" />
          <stop offset="70%" stop-color="#94a3b8" />
          <stop offset="100%" stop-color="#475569" />
        </linearGradient>

        <!-- 复古黄边胶胎 (Gumwall Tire) -->
        <linearGradient id="tireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#262626" />
          <stop offset="65%" stop-color="#171717" />
          <stop offset="100%" stop-color="#0a0a0a" />
        </linearGradient>
        <linearGradient id="gumwallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fde047" />
          <stop offset="100%" stop-color="#d97706" />
        </linearGradient>

        <!-- 鹈鹕黄色巨喙渐变 -->
        <linearGradient id="beakTopGrad" x1="0%" y1="0%" x2="100%" y2="20%">
          <stop offset="0%" stop-color="#fbbf24" />
          <stop offset="60%" stop-color="#f97316" />
          <stop offset="100%" stop-color="#ea580c" />
        </linearGradient>

        <!-- 柔韧大喉囊渐变 (Gular Pouch) -->
        <linearGradient id="throatPouchGrad" x1="15%" y1="0%" x2="85%" y2="100%">
          <stop offset="0%" stop-color="#fda4af" />
          <stop offset="35%" stop-color="#fb7185" />
          <stop offset="75%" stop-color="#f97316" />
          <stop offset="100%" stop-color="#e11d48" />
        </linearGradient>

        <!-- 鹈鹕丰满白色羽毛立体渐变 -->
        <linearGradient id="featherGrad" x1="0%" y1="0%" x2="30%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="75%" stop-color="#f1f5f9" />
          <stop offset="100%" stop-color="#cbd5e1" />
        </linearGradient>

        <!-- 飘扬红白条纹丝巾渐变 -->
        <linearGradient id="scarfGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#ef4444" />
          <stop offset="100%" stop-color="#f87171" />
        </linearGradient>

        <!-- 车大灯锥形光束渐变 -->
        <linearGradient id="headlightBeamGrad" x1="0%" y1="50%" x2="100%" y2="50%">
          <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
          <stop offset="35%" stop-color="#fef9c3" stop-opacity="0.35" />
          <stop offset="100%" stop-color="#fef9c3" stop-opacity="0" />
        </linearGradient>

        <!-- 复古皮革鞍座渐变 -->
        <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#854d0e" />
          <stop offset="60%" stop-color="#713f12" />
          <stop offset="100%" stop-color="#451a03" />
        </linearGradient>
      </defs>

      <!-- =====================================================================
           层级 1: 天空远景、日月星辰、海鸥与白云
           ===================================================================== -->
      <g id="skyFarLayer">
        <!-- 太阳 / 月亮容器 -->
        <g id="celestialGroup" transform="translate(1080, 120)">
          <circle id="celestialGlow" cx="0" cy="0" r="70" fill="#facc15" opacity="0.35" filter="url(#softGlow)" />
          <circle id="celestialCore" cx="0" cy="0" r="44" fill="#fde047" />
          <!-- 月球陨石坑斑纹 (夜间显示) -->
          <g id="moonDetails" opacity="0">
            <circle cx="-10" cy="-12" r="8" fill="#cbd5e1" opacity="0.4" />
            <circle cx="12" cy="12" r="9" fill="#cbd5e1" opacity="0.35" />
            <circle cx="-12" cy="14" r="5.5" fill="#cbd5e1" opacity="0.3" />
          </g>
        </g>

        <!-- 夜晚星空 (平时 opacity=0) -->
        <g id="starsGroup" opacity="0">
          <circle cx="120" cy="50" r="2.2" fill="#fff" opacity="0.9" />
          <circle cx="280" cy="80" r="1.8" fill="#fff" opacity="0.8" />
          <circle cx="430" cy="45" r="2.5" fill="#fff" opacity="0.9" />
          <circle cx="620" cy="70" r="1.6" fill="#fff" opacity="0.75" />
          <circle cx="820" cy="35" r="2.2" fill="#fff" opacity="0.85" />
          <circle cx="950" cy="95" r="1.7" fill="#fff" opacity="0.7" />
          <circle cx="1180" cy="65" r="2.0" fill="#fff" opacity="0.9" />
          <circle cx="340" cy="120" r="1.4" fill="#fff" opacity="0.6" />
          <circle cx="720" cy="110" r="1.8" fill="#fff" opacity="0.7" />
        </g>

        <!-- 远景海岛山峦 -->
        <path id="farIslands" d="M -40,430 Q 180,360 420,410 T 960,370 T 1380,420 L 1380,520 L -40,520 Z" fill="#38bdf8" opacity="0.32" />
        <path id="midHills" d="M -60,455 Q 240,400 560,445 T 1140,410 T 1420,460 L 1420,520 L -60,520 Z" fill="#0284c7" opacity="0.25" />

        <!-- 蔚蓝大海 -->
        <rect x="0" y="465" width="1280" height="60" fill="url(#oceanGrad)" opacity="0.9" />

        <!-- 海上粼粼波光与远帆 -->
        <g id="seaScenery">
          <!-- 远景白色小帆船 -->
          <g transform="translate(860, 442) scale(0.7)">
            <polygon points="0,22 35,22 28,30 5,30" fill="#334155" />
            <polygon points="18,3 18,20 32,20" fill="#ffffff" opacity="0.95" />
            <polygon points="16,6 16,20 2,20" fill="#f1f5f9" opacity="0.85" />
          </g>
          <!-- 远方灯塔 -->
          <g transform="translate(180, 422) scale(0.8)">
            <polygon points="10,48 20,48 18,12 12,12" fill="#e2e8f0" />
            <polygon points="11,36 19,36 18,24 12,24" fill="#ef4444" />
            <rect x="11" y="8" width="8" height="4" fill="#334155" />
            <circle id="lighthouseBeam" cx="15" cy="10" r="4" fill="#fef08a" opacity="0.8" />
          </g>
          <!-- 海鸥小队 -->
          <g id="seagullFlock" transform="translate(300, 150) scale(0.8)">
            <path d="M0,0 Q6,-8 14,0 Q22,-8 28,0" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.9" />
            <path d="M38,-20 Q44,-27 50,-20 Q56,-27 62,-20" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.8" />
            <path d="M-30,-12 Q-25,-18 -19,-12 Q-13,-18 -8,-12" stroke="#ffffff" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.7" />
          </g>
        </g>

        <!-- 飘移白云层 -->
        <g id="cloudsLayer">
          <g class="cloud" transform="translate(90, 75) scale(1.1)">
            <ellipse cx="60" cy="40" rx="55" ry="24" fill="#ffffff" opacity="0.85" />
            <ellipse cx="105" cy="26" rx="42" ry="30" fill="#ffffff" opacity="0.92" />
            <ellipse cx="150" cy="38" rx="48" ry="22" fill="#ffffff" opacity="0.85" />
          </g>
          <g class="cloud" transform="translate(680, 110) scale(0.88)">
            <ellipse cx="60" cy="40" rx="50" ry="22" fill="#ffffff" opacity="0.82" />
            <ellipse cx="100" cy="28" rx="38" ry="26" fill="#ffffff" opacity="0.9" />
            <ellipse cx="140" cy="38" rx="42" ry="20" fill="#ffffff" opacity="0.82" />
          </g>
          <g class="cloud" transform="translate(1120, 60) scale(0.95)">
            <ellipse cx="60" cy="40" rx="48" ry="20" fill="#ffffff" opacity="0.8" />
            <ellipse cx="98" cy="28" rx="36" ry="24" fill="#ffffff" opacity="0.88" />
            <ellipse cx="135" cy="38" rx="40" ry="18" fill="#ffffff" opacity="0.8" />
          </g>
        </g>
      </g>

      <!-- =====================================================================
           层级 2: 中景海堤木护栏、典雅路灯与灌木 (视差滚动)
           ===================================================================== -->
      <g id="midgroundLayer">
        <!-- 防浪海堤基座 -->
        <rect x="0" y="505" width="1280" height="25" fill="#94a3b8" />
        <rect x="0" y="525" width="1280" height="6" fill="#64748b" />
        <!-- 循环移动的木护栏与系缆柱 -->
        <g id="railingsGroup"></g>
        <!-- 复古铸铁海滨路灯 -->
        <g id="streetLampsGroup"></g>
      </g>

      <!-- =====================================================================
           层级 3: 前景公路、绿道专用道、反光路牙与自行车道标线
           ===================================================================== -->
      <g id="roadLayer">
        <!-- 沥青主路面 -->
        <rect x="0" y="530" width="1280" height="190" fill="#334155" />
        <!-- 滨海自行车专用青绿色彩色路面带 -->
        <rect x="0" y="531" width="1280" height="16" fill="#10b981" opacity="0.85" />
        <!-- 红白相间安全路牙 (Curb) -->
        <g id="curbStripesGroup"></g>
        <!-- 公路虚线标线 -->
        <g id="roadMarksGroup"></g>
        <!-- 路面喷涂自行车图标与里程标 -->
        <g id="bikeLaneStencil" transform="translate(900, 642) scale(0.8)" opacity="0.55">
          <circle cx="0" cy="0" r="16" fill="none" stroke="#ffffff" stroke-width="4" />
          <circle cx="56" cy="0" r="16" fill="none" stroke="#ffffff" stroke-width="4" />
          <path d="M0,0 L24,-24 L44,-24 L56,0 M24,-24 L36,0 M16,-34 L32,-34" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
          <text x="75" y="-10" fill="#ffffff" font-size="16" font-weight="bold" font-family="sans-serif">BIKE ONLY</text>
        </g>
      </g>

      <!-- =====================================================================
           层级 4: 主角组合层 (鹈鹕 + 自行车 + 投影 + 车灯光束)
           ===================================================================== -->
      <!-- 自行车与骑手的地面动感投影 -->
      <ellipse id="groundShadow" cx="600" cy="566" rx="210" ry="16" fill="#0f172a" opacity="0.45" filter="url(#softGlow)" />

      <!-- 车灯夜间照射锥形光束 -->
      <polygon id="headlightBeamCone" points="775,348 1320,290 1320,640 775,368" fill="url(#headlightBeamGrad)" opacity="0" />

      <!-- 主体震颤颠簸主容器 -->

    /* ==========================================================================
       1. 场景细节程序化生成：24根辐条、公路标线、防浪桩、路灯与飞花草丛
       ========================================================================== */

    // (1) 前后轮 24 根编织辐条
    function buildSpokes(groupId, count = 24, radius = 62) {
      const g = document.getElementById(groupId);
      for (let i = 0; i < count; i++) {
        const rad = (i * 360 / count) * Math.PI / 180;
        const cross = (i % 2 === 0 ? 5 : -5) * Math.PI / 180;
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", (Math.cos(rad + cross) * 10).toFixed(1));
        line.setAttribute("y1", (Math.sin(rad + cross) * 10).toFixed(1));
        line.setAttribute("x2", (Math.cos(rad) * radius).toFixed(1));
        line.setAttribute("y2", (Math.sin(rad) * radius).toFixed(1));
        line.setAttribute("stroke", "#e2e8f0");
        line.setAttribute("stroke-width", "1.5");
        line.setAttribute("opacity", "0.75");
        g.appendChild(line);
      }
    }
    buildSpokes("rearSpokes");
    buildSpokes("frontSpokes");

    /* ==========================================================================
       2. 经典双骨骼逆运动学解析求解器 (Analytical 2-Bone IK)
       ========================================================================== */
    function solveIK(x1, y1, x2, y2, l1, l2, bendDir = 1) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const dist = Math.hypot(dx, dy);
      const clampedDist = Math.max(Math.abs(l1 - l2) + 0.01, Math.min(dist, (l1 + l2) * 0.999));

      const cosA = (l1 * l1 + clampedDist * clampedDist - l2 * l2) / (2 * l1 * clampedDist);
      const angleBase = Math.atan2(dy, dx);
      const angleOffset = Math.acos(Math.max(-1, Math.min(1, cosA)));

      const kneeAngle = angleBase - bendDir * angleOffset;
      const kx = x1 + Math.cos(kneeAngle) * l1;
      const ky = y1 + Math.sin(kneeAngle) * l1;

      return { kx, ky };
    }

    /* ==========================================================================
       3. 核心几何配置与节点引用 (精确测算，永不脱节)
       ========================================================================== */
    const CRANK_X = 580;
    const CRANK_Y = 480;
    const CRANK_R = 34;

    const FRONT_HIP_X = 528;
    const FRONT_HIP_Y = 340;
    const BACK_HIP_X = 522;
    const BACK_HIP_Y = 342;

    const THIGH_LEN = 98;
    const SHIN_LEN = 98;

    const rearWheelGroup = document.getElementById("rearWheelGroup");
    const frontWheelGroup = document.getElementById("frontWheelGroup");

    const frontCrankLine = document.getElementById("frontCrankLine");
    const frontPedalRect = document.getElementById("frontPedalRect");
    const frontPedalReflector = document.getElementById("frontPedalReflector");
    const backCrankLine = document.getElementById("backCrankLine");
    const backPedalRect = document.getElementById("backPedalRect");
    const backPedalReflector = document.getElementById("backPedalReflector");

    const frontLegBones = document.getElementById("frontLegBones");
    const frontKneeCap = document.getElementById("frontKneeCap");
    const frontWebbedFoot = document.getElementById("frontWebbedFoot");

    const backLegBones = document.getElementById("backLegBones");
    const backKneeCap = document.getElementById("backKneeCap");
    const backWebbedFoot = document.getElementById("backWebbedFoot");

    const pelicanBicycleMaster = document.getElementById("pelicanBicycleMaster");
    const pelicanBodyGroup = document.getElementById("pelicanBodyGroup");
    const throatPouchMesh = document.getElementById("throatPouchMesh");
    const crestGroup = document.getElementById("crestGroup");
    const scarfBackWave = document.getElementById("scarfBackWave");
    const scarfTassel1 = document.getElementById("scarfTassel1");
    const scarfTassel2 = document.getElementById("scarfTassel2");
    const pelicanTailFeathers = document.getElementById("pelicanTailFeathers");
    const eyelidCover = document.getElementById("eyelidCover");

    const fishTailFin = document.getElementById("fishTailFin");
    const fishBubble = document.getElementById("fishBubble");
    const cloudsLayer = document.getElementById("cloudsLayer");
    const bikeLaneStencil = document.getElementById("bikeLaneStencil");
    const headlightBeamCone = document.getElementById("headlightBeamCone");
    const bulbGlow = document.getElementById("bulbGlow");
    const groundShadow = document.getElementById("groundShadow");

    const speedKmhEl = document.getElementById("speedKmh");
    const cadenceRpmEl = document.getElementById("cadenceRpm");
    const distanceKmEl = document.getElementById("distanceKm");

    let currentSpeed = 1.2;
    let targetSpeed = 1.2;
    let isSprinting = false;
    let isCoasting = false;
    let pedalAngle = 0;
    let wheelAngle = 0;
    let chainOffset = 0;
    let time = 0;
    let totalDistanceKm = 3.8;

    let stencilX = 900;
    let blinkTimer = 0;
    let isBlinking = false;

    /* ==========================================================================
       4. 60FPS 丝滑物理引擎主循环
       ========================================================================== */
    let lastTime = performance.now();

    function renderLoop(now) {
      requestAnimationFrame(renderLoop);

      const deltaMs = Math.min(now - lastTime, 50);
      lastTime = now;
      const dt = deltaMs / 1000;

      // 车速平滑 Lerp 插值
      currentSpeed += (targetSpeed - currentSpeed) * 0.12;
      const effectiveSpeed = currentSpeed;

      time += dt * (0.6 + effectiveSpeed * 0.8);

      // (1) 踏频与轮速角位移 (滑行模式下踏频暂停，车轮保持旋转)
      if (!isCoasting && effectiveSpeed > 0.02) {
        pedalAngle += effectiveSpeed * 220 * dt;
        chainOffset -= effectiveSpeed * 190 * dt;
      }
      if (effectiveSpeed > 0.01) {
        wheelAngle += effectiveSpeed * 440 * dt;
      }

      // 里程与仪表盘遥测更新
      totalDistanceKm += (effectiveSpeed * 22 * dt) / 3600;
      speedKmhEl.textContent = (effectiveSpeed * 20.4).toFixed(1);
      cadenceRpmEl.textContent = isCoasting ? "0" : Math.round(effectiveSpeed * 68);
      distanceKmEl.textContent = totalDistanceKm.toFixed(2);

      const rad = (pedalAngle * Math.PI) / 180;
      const wheelRot = (wheelAngle % 360).toFixed(2);
      rearWheelGroup.setAttribute("transform", `translate(420, 485) rotate(${wheelRot})`);
      frontWheelGroup.setAttribute("transform", `translate(780, 485) rotate(${wheelRot})`);
      bikeChainLoop.style.strokeDashoffset = chainOffset.toFixed(1);

      // (2) 多层次视差无缝横向移动
      const roadSpeed = effectiveSpeed * 390 * dt;

      roadDashes.forEach(item => {
        item.x -= roadSpeed;
        if (item.x < -80) item.x += DASH_NUM * 95;
        item.el.setAttribute("x", item.x.toFixed(1));
      });

      curbs.forEach(item => {
        item.x -= roadSpeed;
        if (item.x < -40) item.x += CURB_NUM * 45;
        item.el.setAttribute("x", item.x.toFixed(1));
      });

      posts.forEach(item => {
        item.x -= roadSpeed * 0.65;
        if (item.x < -140) item.x += 10 * 160;
        item.el.setAttribute("transform", `translate(${item.x.toFixed(1)}, 0)`);
      });

      lamps.forEach(item => {
        item.x -= roadSpeed * 0.65;
        if (item.x < -120) item.x += 4 * 420;
        item.el.setAttribute("transform", `translate(${item.x.toFixed(1)}, 0)`);
      });

      grassClumps.forEach(item => {
        item.x -= roadSpeed * 1.35;
        if (item.x < -120) item.x += 12 * 140;
        item.el.setAttribute("transform", `translate(${item.x.toFixed(1)}, 0)`);
      });

      stencilX -= roadSpeed;
      if (stencilX < -160) stencilX = 1400;
      bikeLaneStencil.setAttribute("transform", `translate(${stencilX.toFixed(1)}, 642) scale(0.8)`);

      const cloudShift = (time * 18) % 1280;
      cloudsLayer.setAttribute("transform", `translate(${-cloudShift}, 0)`);

      windStreaks.forEach(item => {
        item.x -= (roadSpeed * 1.5 + 80 * dt) * item.speedMult;
        if (item.x < -item.len) {
          item.x = 1320 + Math.random() * 200;
          item.y = 100 + Math.random() * 450;
        }
        item.el.setAttribute("x1", item.x.toFixed(1));
        item.el.setAttribute("y1", item.y.toFixed(1));
        item.el.setAttribute("x2", (item.x + item.len * Math.min(1.8, 0.4 + effectiveSpeed * 0.6)).toFixed(1));
        item.el.setAttribute("y2", item.y.toFixed(1));
      });

      // (3) 整车路感震颤与身体重心起伏 (Bobbing & Rocking)
      const pedalPowerPhase = isCoasting ? 0 : Math.sin(rad * 2);
      const roadJitter = Math.sin(time * 18) * (0.75 * Math.min(1, effectiveSpeed));
      const bodyBobY = pedalPowerPhase * (3.8 * Math.min(1.5, effectiveSpeed)) + roadJitter;
      const bodyTilt = isCoasting ? -1.5 : Math.sin(rad) * (2.0 * Math.min(1.4, effectiveSpeed));

      pelicanBodyGroup.setAttribute(
        "transform",
        `translate(0, ${bodyBobY.toFixed(2)}) rotate(${bodyTilt.toFixed(2)}, 528, 340)`
      );

      const bikeBounce = Math.sin(time * 15) * 0.8 * Math.min(1, effectiveSpeed);
      pelicanBicycleMaster.setAttribute("transform", `translate(0, ${bikeBounce.toFixed(2)})`);
      groundShadow.setAttribute("rx", (210 - bodyBobY * 3).toFixed(1));
      groundShadow.setAttribute("opacity", (0.45 - bodyBobY * 0.015).toFixed(2));

      // (4) 喉囊与领巾物理仿真 (Elastic Wobble)
      const pouchJiggle = Math.sin(time * 8.5) * 7.0 * effectiveSpeed;
      const pouchDroop = Math.cos(rad * 2) * 4.5 * effectiveSpeed;
      throatPouchMesh.setAttribute(
        "d",
        `M 20,11 C 32,${(40 + pouchDroop).toFixed(1)} ${(65 + pouchJiggle).toFixed(1)},${(78 + pouchDroop * 1.4).toFixed(1)} 88,58 C 102,42 102,18 96,11 Z`
      );

      const scarfWave1 = Math.sin(time * 12) * 12 * (0.6 + effectiveSpeed * 0.5);
      const scarfWave2 = Math.cos(time * 10) * 16 * (0.6 + effectiveSpeed * 0.5);
      scarfBackWave.setAttribute(
        "d",
        `M 0,0 C -30,${(5 + scarfWave1 * 0.3).toFixed(1)} -60,${(-15 + scarfWave2 * 0.6).toFixed(1)} -90,${(-8 + scarfWave1).toFixed(1)} C -110,${(-4 + scarfWave2).toFixed(1)} -125,${(-18 + scarfWave1 * 1.2).toFixed(1)} -140,${(-12 + scarfWave2 * 1.4).toFixed(1)} C -125,5 -90,0 -70,12 C -40,15 -20,8 0,0 Z`
      );
      scarfTassel1.setAttribute("y2", (-10 + scarfWave2 * 1.4).toFixed(1));
      scarfTassel2.setAttribute("y2", (-3 + scarfWave1 * 1.3).toFixed(1));

      const crestWave = Math.sin(time * 11) * 6 * (0.4 + effectiveSpeed * 0.6);
      crestGroup.setAttribute("transform", `rotate(${crestWave.toFixed(2)}, -12, -14)`);

      const tailTremble = Math.cos(time * 13) * 3 * effectiveSpeed;
      pelicanTailFeathers.setAttribute("transform", `translate(440, 290) rotate(${tailTremble.toFixed(1)}, 0, 20)`);

      const fishTailSwish = Math.sin(time * 14) * 22;
      fishTailFin.setAttribute("transform", `rotate(${fishTailSwish.toFixed(1)}, 16, 0)`);
      const bubbleSize = 2.4 + Math.abs(Math.sin(time * 5)) * 2.2;
      fishBubble.setAttribute("r", bubbleSize.toFixed(1));

      // (5) 脚踏板圆周位置与曲柄连杆
      const curPedalAngle = isCoasting ? 0 : rad;
      const frontPedalX = CRANK_X + Math.cos(curPedalAngle) * CRANK_R;
      const frontPedalY = CRANK_Y + Math.sin(curPedalAngle) * CRANK_R;

      const backPedalX = CRANK_X + Math.cos(curPedalAngle + Math.PI) * CRANK_R;
      const backPedalY = CRANK_Y + Math.sin(curPedalAngle + Math.PI) * CRANK_R;

      frontCrankLine.setAttribute("x2", frontPedalX.toFixed(1));
      frontCrankLine.setAttribute("y2", frontPedalY.toFixed(1));
      frontPedalRect.setAttribute("x", (frontPedalX - 18).toFixed(1));
      frontPedalRect.setAttribute("y", (frontPedalY - 5.5).toFixed(1));
      frontPedalReflector.setAttribute("x1", (frontPedalX - 14).toFixed(1));
      frontPedalReflector.setAttribute("x2", (frontPedalX + 14).toFixed(1));
      frontPedalReflector.setAttribute("y1", frontPedalY.toFixed(1));
      frontPedalReflector.setAttribute("y2", frontPedalY.toFixed(1));

      backCrankLine.setAttribute("x2", backPedalX.toFixed(1));
      backCrankLine.setAttribute("y2", backPedalY.toFixed(1));
      backPedalRect.setAttribute("x", (backPedalX - 15).toFixed(1));
      backPedalRect.setAttribute("y", (backPedalY - 4.5).toFixed(1));
      backPedalReflector.setAttribute("x1", (backPedalX - 12).toFixed(1));
      backPedalReflector.setAttribute("x2", (backPedalX + 12).toFixed(1));
      backPedalReflector.setAttribute("y1", backPedalY.toFixed(1));
      backPedalReflector.setAttribute("y2", backPedalY.toFixed(1));

      // (6) 逆运动学求解腿部关节 (IK)
      const curFrontHipY = FRONT_HIP_Y + bodyBobY;
      const curBackHipY = BACK_HIP_Y + bodyBobY;

      const frontIK = solveIK(FRONT_HIP_X, curFrontHipY, frontPedalX, frontPedalY, THIGH_LEN, SHIN_LEN, 1);
      frontLegBones.setAttribute(
        "points",
        `${FRONT_HIP_X},${curFrontHipY.toFixed(1)} ${frontIK.kx.toFixed(1)},${frontIK.ky.toFixed(1)} ${frontPedalX.toFixed(1)},${frontPedalY.toFixed(1)}`
      );
      frontKneeCap.setAttribute("cx", frontIK.kx.toFixed(1));
      frontKneeCap.setAttribute("cy", frontIK.ky.toFixed(1));

      const frontAnkleTilt = Math.sin(curPedalAngle) * 7;
      frontWebbedFoot.setAttribute(
        "points",
        `${(frontPedalX - 24).toFixed(1)},${(frontPedalY + 3).toFixed(1)} ${(frontPedalX + 24).toFixed(1)},${(frontPedalY + 3).toFixed(1)} ${(frontPedalX + 4).toFixed(1)},${(frontPedalY - 17 + frontAnkleTilt).toFixed(1)}`
      );

      const backIK = solveIK(BACK_HIP_X, curBackHipY, backPedalX, backPedalY, THIGH_LEN * 0.96, SHIN_LEN * 0.96, 1);
      backLegBones.setAttribute(
        "points",
        `${BACK_HIP_X},${curBackHipY.toFixed(1)} ${backIK.kx.toFixed(1)},${backIK.ky.toFixed(1)} ${backPedalX.toFixed(1)},${backPedalY.toFixed(1)}`
      );
      backKneeCap.setAttribute("cx", backIK.kx.toFixed(1));
      backKneeCap.setAttribute("cy", backIK.ky.toFixed(1));

      const backAnkleTilt = Math.sin(curPedalAngle + Math.PI) * 7;
      backWebbedFoot.setAttribute(
        "points",
        `${(backPedalX - 22).toFixed(1)},${(backPedalY + 3).toFixed(1)} ${(backPedalX + 22).toFixed(1)},${(backPedalY + 3).toFixed(1)} ${(backPedalX + 3).toFixed(1)},${(backPedalY - 16 + backAnkleTilt).toFixed(1)}`
      );

      // (7) 自动自然眨眼
      blinkTimer += dt;
      if (!isBlinking && blinkTimer > 3.0 + Math.random() * 3.5) {
        isBlinking = true;
        blinkTimer = 0;
        eyelidCover.setAttribute("stroke-width", "7");
        setTimeout(() => {
          eyelidCover.setAttribute("stroke-width", "0");
          isBlinking = false;
        }, 130);
      }
    }

    requestAnimationFrame(renderLoop);

    /* ==========================================================================
       5. 纯原生 Web Audio 合成音效引擎 (无外部音频依赖)
       ========================================================================== */
    let audioCtx = null;
    let audioEnabled = true;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // 逼真黄铜双音车铃
    function playBicycleBell() {
      if (!audioEnabled) return;
      const ctx = getAudioContext();
      const now = ctx.currentTime;

      function chime(freq, start, duration, vol) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, start);

        gain.gain.setValueAtTime(vol, start);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + duration);
      }

      chime(2350, now, 0.5, 0.28);
      chime(4700, now, 0.2, 0.1);
      chime(2820, now + 0.11, 0.7, 0.32);
      chime(5640, now + 0.11, 0.25, 0.1);
    }

    // 诙谐鹈鹕共振腔欢叫
    function playPelicanHonk() {
      if (!audioEnabled) return;
      const ctx = getAudioContext();
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();

      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(155, now);
      osc.frequency.linearRampToValueAtTime(310, now + 0.08);
      osc.frequency.exponentialRampToValueAtTime(110, now + 0.34);

      filter.type = "bandpass";
      filter.frequency.setValueAtTime(530, now);
      filter.Q.setValueAtTime(4.5, now);

      gain.gain.setValueAtTime(0.01, now);
      gain.gain.linearRampToValueAtTime(0.35, now + 0.06);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + 0.38);
    }

    /* ==========================================================================
       6. UI 控件交互与键盘快捷键绑定
       ========================================================================== */
    const speedSlider = document.getElementById("speedSlider");
    const speedVal = document.getElementById("speedVal");
    const sprintFlair = document.getElementById("sprintFlair");
    const bellBtn = document.getElementById("bellBtn");
    const honkBtn = document.getElementById("honkBtn");
    const coastBtn = document.getElementById("coastBtn");
    const gogglesBtn = document.getElementById("gogglesBtn");
    const sprintBtn = document.getElementById("sprintBtn");
    const themeBtn = document.getElementById("themeBtn");
    const audioToggleBtn = document.getElementById("audioToggleBtn");
    const gogglesGroup = document.getElementById("gogglesGroup");
    const speechBubble = document.getElementById("speechBubble");

      targetSpeed = parseFloat(e.target.value);

    bellBtn.addEventListener("click", () => {
      playBicycleBell();
      bellBtn.classList.add("active");
      setTimeout(() => bellBtn.classList.remove("active"), 200);
    });

    const honkLines = [
      "呱！前面有肥美的海鲈鱼！🐟💨",
      "大嘴兜风，越骑越轻松！🚴‍♂️✨",
      "叮叮！海滨环岛赛冲锋领骑！🌊",
      "风速正好，踏频 90 稳如老狗！🏆",
      "呱呱！前面的海鸥借过一下~ 🦆💨",
      "嘴大吃四方，脚踏行天下！🚲🎉"
    ];
    let bubbleTimer = null;
    function triggerHonk() {
      playPelicanHonk();
      clearTimeout(bubbleTimer);
      const randomLine = honkLines[Math.floor(Math.random() * honkLines.length)];
      speechBubble.textContent = randomLine;
      speechBubble.classList.add("active");
      bubbleTimer = setTimeout(() => {
        speechBubble.classList.remove("active");
      }, 2200);
    }
    honkBtn.addEventListener("click", triggerHonk);

    // 自由滑行模式
    coastBtn.addEventListener("click", () => {
      isCoasting = !isCoasting;
      coastBtn.classList.toggle("active", isCoasting);
      if (isCoasting) {
        speechBubble.textContent = "下坡溜车喽，双脚放空超惬意~ 🍃";
        speechBubble.classList.add("active");
        setTimeout(() => speechBubble.classList.remove("active"), 2000);
      }
    });

    // 护目风镜切换
    let showGoggles = false;
    gogglesBtn.addEventListener("click", () => {
      showGoggles = !showGoggles;
      gogglesGroup.style.display = showGoggles ? "block" : "none";
      gogglesBtn.classList.toggle("active", showGoggles);
    });

    // 冲刺加速控制
    function startSprint() {
      if (isSprinting) return;
      isSprinting = true;
      if (isCoasting) {
        isCoasting = false;
        coastBtn.classList.remove("active");
      }
      targetSpeed = 2.8;
      speedSlider.value = "2.8";
      speedVal.textContent = "2.8x";
      sprintFlair.style.display = "inline-flex";
      sprintBtn.classList.add("active");
      playBicycleBell();
    }
    function endSprint() {
      if (!isSprinting) return;
      isSprinting = false;
      targetSpeed = 1.2;
      speedSlider.value = "1.2";
      speedVal.textContent = "1.2x";
      sprintFlair.style.display = "none";
      sprintBtn.classList.remove("active");
    }
    sprintBtn.addEventListener("mousedown", startSprint);
    window.addEventListener("mouseup", endSprint);
    sprintBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startSprint(); }, { passive: false });
    window.addEventListener("touchend", endSprint);

    // 晨昏昼夜主题切换
    const themes = ["theme-day", "theme-sunset", "theme-night"];
    let currentThemeIndex = 0;
    const celestialGlow = document.getElementById("celestialGlow");
    const celestialCore = document.getElementById("celestialCore");
    const moonDetails = document.getElementById("moonDetails");
    const starsGroup = document.getElementById("starsGroup");
    const lampGlows = document.querySelectorAll(".lamp-glow");

    themeBtn.addEventListener("click", () => {
      document.body.classList.remove(themes[currentThemeIndex]);
      currentThemeIndex = (currentThemeIndex + 1) % themes.length;
      const newTheme = themes[currentThemeIndex];
      document.body.classList.add(newTheme);

      if (newTheme === "theme-night") {
        celestialCore.setAttribute("fill", "#f1f5f9");
        celestialGlow.setAttribute("fill", "#e2e8f0");
        celestialGlow.setAttribute("opacity", "0.38");
        moonDetails.setAttribute("opacity", "1");
        starsGroup.setAttribute("opacity", "0.95");
        headlightBeamCone.setAttribute("opacity", "0.85");
        bulbGlow.setAttribute("opacity", "1");
        lampGlows.forEach(el => el.setAttribute("opacity", "0.75"));
        themeBtn.innerHTML = "<span>🌙 星空月夜</span><span class='key-tip'>T</span>";
      } else if (newTheme === "theme-sunset") {
        celestialCore.setAttribute("fill", "#f43f5e");
        celestialGlow.setAttribute("fill", "#fb923c");
        celestialGlow.setAttribute("opacity", "0.55");
        moonDetails.setAttribute("opacity", "0");
        starsGroup.setAttribute("opacity", "0");
        headlightBeamCone.setAttribute("opacity", "0.35");
        bulbGlow.setAttribute("opacity", "0.9");
        lampGlows.forEach(el => el.setAttribute("opacity", "0.4"));
        themeBtn.innerHTML = "<span>🌇 黄金晚霞</span><span class='key-tip'>T</span>";
      } else {
        celestialCore.setAttribute("fill", "#fde047");
        celestialGlow.setAttribute("fill", "#facc15");
        celestialGlow.setAttribute("opacity", "0.35");
        moonDetails.setAttribute("opacity", "0");
        starsGroup.setAttribute("opacity", "0");
        headlightBeamCone.setAttribute("opacity", "0");
        bulbGlow.setAttribute("opacity", "0.5");
        lampGlows.forEach(el => el.setAttribute("opacity", "0"));
        themeBtn.innerHTML = "<span>🌅 晴空碧海</span><span class='key-tip'>T</span>";
      }
    });

    // 音效开关
    audioToggleBtn.addEventListener("click", () => {
      audioEnabled = !audioEnabled;
      audioToggleBtn.innerHTML = audioEnabled ? "<span>🔊 音效</span><span class='key-tip'>M</span>" : "<span>🔇 静音</span><span class='key-tip'>M</span>";
      audioToggleBtn.classList.toggle("active", !audioEnabled);
      if (audioEnabled) playBicycleBell();
    });

    // 场景内物料点击交互
    document.getElementById("bikeBellElement").addEventListener("click", (e) => {
      e.stopPropagation();
      playBicycleBell();
      bellBtn.classList.add("active");
      setTimeout(() => bellBtn.classList.remove("active"), 200);
    });

    document.getElementById("pelicanHeadGroup").addEventListener("click", () => {
      triggerHonk();
    });
    document.getElementById("pelicanHeadGroup").style.cursor = "pointer";

    document.getElementById("frontBasket").addEventListener("click", (e) => {
      e.stopPropagation();
      triggerHonk();
    });

    // 全局快捷键
    window.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT") return;

      if (e.key === "b" || e.key === "B") {
        bellBtn.click();
      } else if (e.key === "h" || e.key === "H" || e.code === "Space") {
        e.preventDefault();
        triggerHonk();
      } else if (e.key === "c" || e.key === "C") {
        coastBtn.click();
      } else if (e.key === "g" || e.key === "G") {
        gogglesBtn.click();
      } else if (e.key === "t" || e.key === "T") {
        themeBtn.click();
      } else if (e.key === "m" || e.key === "M") {
        audioToggleBtn.click();
      } else if (e.key === "ArrowUp") {
        targetSpeed = Math.min(3.0, targetSpeed + 0.2);
        speedSlider.value = targetSpeed.toFixed(1);
        speedVal.textContent = targetSpeed.toFixed(1) + "x";
        if (isCoasting) { isCoasting = false; coastBtn.classList.remove("active"); }
      } else if (e.key === "ArrowDown") {
        targetSpeed = Math.max(0, targetSpeed - 0.2);
        speedSlider.value = targetSpeed.toFixed(1);
        speedVal.textContent = targetSpeed.toFixed(1) + "x";
      }
    });
  </script>
</body>
</html>
