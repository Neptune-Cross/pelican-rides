<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d8ece7">
  <title>海风骑行 · 鹈鹕的沿岸日常</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Aptos", "Microsoft YaHei UI", "PingFang SC", sans-serif;
      color: #294447;
      background: #d8ece7;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-width: 320px;
      min-height: 100%;
      margin: 0;
    }

    body { min-height: 100svh; }

    .stage {
      position: relative;
      display: grid;
      min-height: 100svh;
      overflow: hidden;
      place-items: center;
      isolation: isolate;
      background: #d8ece7;
    }

    .artwork {
      display: block;
      width: min(100vw, 1520px);
      max-height: 100svh;
      height: auto;
    }

    .masthead {
      position: absolute;
      z-index: 2;
      top: clamp(22px, 4.2vh, 42px);
      left: clamp(22px, 5vw, 72px);
      display: grid;
      gap: 5px;
      pointer-events: none;
    }

    .eyebrow {
      margin: 0;
      color: #547470;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 1.7px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #294447;
      font-size: 22px;
      font-weight: 650;
      line-height: 1.2;
    }

    .edition {
      position: absolute;
      z-index: 2;
      top: clamp(26px, 4.5vh, 46px);
      right: clamp(22px, 5vw, 72px);
      display: flex;
      align-items: center;
      gap: 9px;
      color: #547470;
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .edition::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #df805f;
      content: "";
    }

    .motion-toggle {
      position: absolute;
      z-index: 3;
      right: clamp(20px, 4vw, 56px);
      bottom: clamp(18px, 3.2vh, 34px);
      display: grid;
      width: 46px;
      height: 46px;
      padding: 0;
      place-items: center;
      border: 1px solid rgb(41 68 71 / 17%);
      border-radius: 50%;
      color: #294447;
      background: rgb(250 247 236 / 90%);
      box-shadow: 0 5px 18px rgb(44 74 69 / 10%);
      cursor: pointer;
      transition: background-color 160ms ease, transform 160ms ease;
    }

    .motion-toggle:hover { background: #fffdf5; transform: translateY(-2px); }
    .motion-toggle:focus-visible { outline: 3px solid #d97959; outline-offset: 3px; }
    .motion-toggle svg { width: 19px; height: 19px; fill: currentColor; }
    .motion-toggle svg[hidden] { display: none; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    html.is-paused *,
    html.is-paused *::before,
    html.is-paused *::after { animation-play-state: paused !important; }

    .cloud-drift { animation: cloud-drift 20s ease-in-out infinite alternate; }
    .cloud-drift.slower { animation-duration: 27s; animation-direction: alternate-reverse; }
    .water-drift { animation: water-drift 26s linear infinite; }
    .wheel-spin {
      animation: wheel-spin 2.4s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    @keyframes cloud-drift {
      from { transform: translateX(-14px); }
      to { transform: translateX(18px); }
    }

    @keyframes water-drift {
      from { transform: translateX(0); }
      to { transform: translateX(-90px); }
    }

    @keyframes wheel-spin { to { transform: rotate(360deg); } }

    @media (max-width: 680px) {
      .artwork { width: 100vw; max-height: 68svh; }
      .masthead { top: 22px; left: 20px; gap: 4px; }
      h1 { font-size: 20px; }
      .eyebrow, .edition { font-size: 9px; }
      .edition { top: 28px; right: 20px; gap: 7px; letter-spacing: 0.8px; }
      .motion-toggle { right: 20px; bottom: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cloud-drift, .water-drift, .wheel-spin { animation: none; }
      .motion-toggle { transition: none; }
    }
  </style>
</head>

  <script>
    const scene = document.getElementById("ride-scene");
    const toggle = document.getElementById("motion-toggle");
    const pauseIcon = document.getElementById("pause-icon");
    const playIcon = document.getElementById("play-icon");
    const label = document.getElementById("motion-label");
    const mobileLayout = window.matchMedia("(max-width: 680px)");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    let paused = reducedMotion.matches;

    function updateViewBox() {
      scene.setAttribute("viewBox", mobileLayout.matches ? "250 35 700 665" : "0 0 1200 760");
    }

    function updateMotionControl() {
      const action = paused ? "继续动画" : "暂停动画";
      document.documentElement.classList.toggle("is-paused", paused);
      toggle.setAttribute("aria-label", action);
      toggle.title = action;
      label.textContent = action;
      pauseIcon.hidden = paused;
      playIcon.hidden = !paused;
      if (paused) scene.pauseAnimations();
      else scene.unpauseAnimations();
    }

    updateViewBox();
    updateMotionControl();
    mobileLayout.addEventListener("change", updateViewBox);
    reducedMotion.addEventListener("change", (event) => {
      if (event.matches) {
        paused = true;
        updateMotionControl();
      }
    });
    toggle.addEventListener("click", () => {
      paused = !paused;
      updateMotionControl();
    });
  </script>
</body>
</html>
