<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#bce8dc">
  <title>鹈鹕 · 海风骑行</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --ink: #20383c;
      --tempo: 1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: #20383c;
      color: var(--ink);
    }

    button { font: inherit; }

    .experience {
      min-height: 100svh;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      justify-items: center;
      background: #20383c;
    }

    .stage {
      position: relative;
      width: 100%;
      height: min(100svh, 960px);
      overflow: hidden;
      background: #bce8dc;
      isolation: isolate;
    }

    .landscape {
      display: block;
      width: 100%;
      height: 100%;
    }

    .masthead {
      position: absolute;
      z-index: 2;
      top: clamp(22px, 4.8vh, 52px);
      left: clamp(22px, 5vw, 72px);
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1.5px solid rgba(32, 56, 60, .42);
      border-radius: 50%;
      background: rgba(255, 250, 232, .72);
    }

    .brand-mark svg { width: 19px; height: 19px; }

    .masthead h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 750;
      line-height: 1.15;
    }

    .masthead p {
      margin: 4px 0 0;
      color: rgba(32, 56, 60, .72);
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
    }

    .scene-note {
      position: absolute;
      z-index: 2;
      top: clamp(25px, 5vh, 54px);
      right: clamp(22px, 5vw, 72px);
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(32, 56, 60, .72);
      font-size: 10px;
      font-weight: 750;
      user-select: none;
    }

    .sun-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e8785e;
      box-shadow: 0 0 0 4px rgba(232, 120, 94, .15);
    }

    .control-dock {
      position: absolute;
      z-index: 3;
      right: clamp(20px, 4vw, 60px);
      bottom: clamp(20px, 4vh, 42px);
      left: clamp(20px, 4vw, 60px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: #fff9e9;
    }

    .motion-label {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 11px;
      font-weight: 700;
      text-shadow: 0 1px 8px rgba(17, 38, 39, .28);
    }

    .motion-label::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #e9bf54;
      content: "";
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px;
      border: 1px solid rgba(255, 255, 255, .44);
      border-radius: 7px;
      background: rgba(255, 250, 232, .94);
      box-shadow: 0 8px 28px rgba(23, 48, 50, .16);
      color: var(--ink);
    }

    .play-button {
      width: 38px;
      height: 38px;
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      border: 0;
      border-radius: 4px;
      background: #e8785e;
      color: #fffdf4;
      cursor: pointer;
      transition: background-color 150ms ease, transform 150ms ease;
    }

    .play-button:hover { background: #d9614c; }
    .play-button:active { transform: scale(.96); }
    .play-button:focus-visible, .speed-button:focus-visible { outline: 3px solid #3c8882; outline-offset: 2px; }
    .play-button svg { width: 17px; height: 17px; }
    .play-icon { display: none; }
    .experience[data-motion="paused"] .pause-icon { display: none; }
    .experience[data-motion="paused"] .play-icon { display: block; }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 2px;
    }

    .speed-button {
      min-width: 43px;
      height: 34px;
      padding: 0 8px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #526568;
      cursor: pointer;
      font-size: 11px;
      font-weight: 750;
    }

    .speed-button[aria-pressed="true"] {
      background: #d9eee5;
      color: #245f5b;
    }

    .wheel-spokes, .crank, .cloud, .coast-lines, .ride-bob, .pedal-leg {
      transform-box: view-box;
    }

    .wheel-spokes {
      animation: wheel-spin calc(1.35s / var(--tempo)) linear infinite;
      transform-origin: center;
    }

    .crank {
      animation: wheel-spin calc(1.15s / var(--tempo)) linear infinite;
      transform-origin: center;
    }

    .cloud {
      animation: cloud-drift calc(28s / var(--tempo)) ease-in-out infinite alternate;
    }

    .cloud--far { animation-duration: calc(39s / var(--tempo)); }

    .coast-lines {
      animation: water-drift calc(16s / var(--tempo)) linear infinite;
    }

    .road-dash {
      animation: dashflow calc(2.8s / var(--tempo)) linear infinite;
    }

    .ride-bob {
      animation: ride-bob calc(1.8s / var(--tempo)) ease-in-out infinite;
      transform-origin: center;
    }

    .pedal-leg {
      animation: leg-pedal calc(1.15s / var(--tempo)) ease-in-out infinite alternate;
      transform-origin: center;
    }

    .pedal-leg--rear { animation-delay: calc(-.58s / var(--tempo)); }

    .experience[data-motion="paused"] * { animation-play-state: paused !important; }

    @keyframes wheel-spin { to { transform: rotate(360deg); } }
    @keyframes cloud-drift { to { transform: translateX(72px); } }
    @keyframes water-drift { to { transform: translateX(-68px); } }
    @keyframes dashflow { to { stroke-dashoffset: -158; } }
    @keyframes ride-bob { 50% { transform: translateY(-3px) rotate(-.25deg); } }
    @keyframes leg-pedal { to { transform: rotate(13deg); } }

    @media (max-width: 700px) {
      .experience { grid-template-rows: minmax(0, 1fr) auto; }
      .stage { height: min(64svh, 560px); min-height: 420px; }
      .masthead { top: 20px; left: 18px; gap: 9px; }
      .brand-mark { width: 30px; height: 30px; }
      .masthead h1 { font-size: 15px; }
      .masthead p { font-size: 9px; }
      .scene-note { top: 26px; right: 18px; font-size: 9px; }
      .control-dock { right: 14px; bottom: 14px; left: 14px; gap: 8px; }
      .motion-label { gap: 6px; font-size: 10px; }
      .controls { gap: 6px; padding: 5px; }
      .play-button { width: 36px; height: 36px; }
      .speed-button { min-width: 37px; padding: 0 5px; font-size: 10px; }
    }

    @media (max-width: 390px) {
      .scene-note { display: none; }
      .motion-label { max-width: 112px; line-height: 1.25; }
      .control-dock { align-items: flex-end; }
      .speed-button { min-width: 34px; padding: 0 4px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>

        <div class="controls" aria-label="动画控制">

            <svg class="play-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3.8c0-.6.7-1 1.2-.7l9.1 5.8c.5.3.5 1.1 0 1.4l-9.1 5.8c-.5.3-1.2-.1-1.2-.7V3.8Z" fill="currentColor" /></svg>

            <button class="speed-button" type="button" data-speed="1" aria-pressed="true">1×</button>

  </main>

  <script>
    const experience = document.getElementById("experience");
    const stage = document.getElementById("stage");
    const landscape = document.getElementById("landscape");
    const riderBike = document.getElementById("rider-bike");
    const playToggle = document.getElementById("play-toggle");

    function frameScene() {
      const ratio = stage.clientWidth / stage.clientHeight;
      const viewWidth = Math.min(1200, 800 * ratio);
      const viewHeight = viewWidth / ratio;
      landscape.setAttribute("viewBox", `${600 - viewWidth / 2} ${400 - viewHeight / 2} ${viewWidth} ${viewHeight}`);
      const scale = Math.min(1, (viewWidth - 26) / 690);
      riderBike.setAttribute("transform", `translate(600 0) scale(${scale}) translate(-600 0)`);
    }

    new ResizeObserver(frameScene).observe(stage);
    frameScene();

    playToggle.addEventListener("click", () => {
      const paused = experience.dataset.motion !== "paused";
      experience.dataset.motion = paused ? "paused" : "playing";
      playToggle.setAttribute("aria-pressed", String(paused));
      playToggle.setAttribute("aria-label", paused ? "继续播放动画" : "暂停动画");
      playToggle.title = paused ? "继续播放动画" : "暂停动画";
      document.getElementById("motion-label").textContent = paused ? "海风暂歇" : "沿海岸轻快前行";
    });

    document.querySelectorAll(".speed-button").forEach((button) => {
      button.addEventListener("click", () => {
        document.documentElement.style.setProperty("--tempo", button.dataset.speed);
        document.querySelectorAll(".speed-button").forEach((option) => {
          option.setAttribute("aria-pressed", String(option === button));
        });
      });
    });

    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      experience.dataset.motion = "paused";
      playToggle.setAttribute("aria-pressed", "true");
      playToggle.setAttribute("aria-label", "继续播放动画");
      playToggle.title = "继续播放动画";
      document.getElementById("motion-label").textContent = "海风暂歇";
    }
  </script>
</body>
</html>
