    .wrap {
      text-align: center;
      padding: 16px;
      display: grid;
      gap: 8px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      color: #eaf4ff;
      letter-spacing: 1px;
    }

    #bikeScene {
      width: min(960px, 96vw);
      height: auto;
      border: 4px solid #263548;
      border-radius: 16px;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45);
      background: linear-gradient(to bottom, #9dd6ff 0%, #e4f4ff 60%, #d9e8d6 100%);
    }

    .ground {
      fill: #7dc68d;
    }

    .wheel {
      transform-origin: center;
      transform-box: fill-box;
      animation: spin 1.1s linear infinite;
    }

    .crank {
      transform-origin: center;
      transform-box: fill-box;
      animation: spin 0.6s linear infinite;
    }

    .bike-group {
      transform-origin: 360px 300px;
      transform-box: fill-box;
      animation: bikeBob 0.6s ease-in-out infinite;
    }

    .rider {
      transform-origin: 238px 177px;
      transform-box: fill-box;
      animation: riderBob 0.6s ease-in-out infinite;
    }

    .wing-left {
      transform-origin: 205px 166px;
      transform-box: fill-box;
      animation: wingLeft 0.5s ease-in-out infinite;
    }

    .wing-right {
      transform-origin: 276px 166px;
      transform-box: fill-box;
      animation: wingRight 0.5s ease-in-out infinite;
    }

    .leg-left {
      transform-origin: 236px 188px;
      transform-box: fill-box;
      animation: legLeft 0.6s ease-in-out infinite;
    }

    .leg-right {
      transform-origin: 244px 188px;
      transform-box: fill-box;
      animation: legRight 0.6s ease-in-out infinite;
    }

    .chain {
      animation: chain 0.6s linear infinite;
    }

    .cloud {
      fill: #ffffff;
      opacity: 0.78;
      transform-box: fill-box;
    }

    .cloud-1 { animation: floatCloud 18s linear infinite; }
    .cloud-2 { animation: floatCloud 22s linear reverse infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes chain {
      from { transform: translateY(0); }
      50% { transform: translateY(-1px); }
      to { transform: translateY(0); }
    }

    @keyframes bikeBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }

    @keyframes riderBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(3px); }
    }

    @keyframes wingLeft {
      0%, 100% { transform: rotate(14deg); }
      50% { transform: rotate(-16deg); }
    }

    @keyframes wingRight {
      0%, 100% { transform: rotate(-14deg); }
      50% { transform: rotate(16deg); }
    }

    @keyframes legLeft {
      0%, 100% { transform: rotate(-14deg); }
      50% { transform: rotate(18deg); }
    }

    @keyframes legRight {
      0%, 100% { transform: rotate(16deg); }
      50% { transform: rotate(-12deg); }
    }

    @keyframes floatCloud {
      from { transform: translateX(-90px); }
      to { transform: translateX(120px); }
    }
    html[data-viewer] .wrap { grid-row: 2; align-self: center; justify-self: center; width: min(100%, 1200px); box-sizing: border-box; min-height: 0; }
    html[data-viewer] .wrap h1 { display: none; }
