<script>
const motion = matchMedia('(prefers-reduced-motion: reduce)');
const button = document.getElementById('toggle');
const parts = Object.fromEntries(['nearLeg','farLeg','nearFoot','farFoot','crank'].map(id => [id,document.getElementById(id)]));
let paused = motion.matches, elapsed = 0, previous = null;
function render(t) {
 const angle = t / 1200 * Math.PI * 2;
 const x = 568 + Math.cos(angle) * 28, y = 477 + Math.sin(angle) * 28;
 const bx = 1136 - x, by = 954 - y;
 parts.nearLeg.setAttribute('d',`M522 372 Q${530 + Math.cos(angle)*12} 410 ${x} ${y}`);
 parts.farLeg.setAttribute('d',`M503 373 Q${491 - Math.cos(angle)*12} 413 ${bx} ${by}`);
 parts.crank.setAttribute('d',`M${bx} ${by}L${x} ${y}`);
 parts.nearFoot.setAttribute('d',`M${x-9} ${y-4}l23 0`);
 parts.farFoot.setAttribute('d',`M${bx-9} ${by-4}l23 0`);
}
function sync(){document.body.classList.toggle('paused',paused);button.textContent=paused?'▷':'Ⅱ';button.title=button.ariaLabel=paused?'播放动画':'暂停动画';}
button.addEventListener('click',()=>{paused=!paused;sync();});
motion.addEventListener('change',e=>{paused=e.matches;sync();});
function frame(now){if(previous!==null && !paused)elapsed+=Math.min(now-previous,50);previous=now;render(elapsed);requestAnimationFrame(frame);}
sync();requestAnimationFrame(frame);
</script>
