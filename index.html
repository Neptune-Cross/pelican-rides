<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹈鹕合集</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; letter-spacing: 0; }
    html, body {
      background: #1f3d32;
      color: #163027;
      font-family: Georgia, "Songti SC", "Microsoft YaHei", serif;
    }
    .piece {
      position: relative;
      display: block;
      min-height: 72svh;
      overflow: hidden;
      color: #163027;
      text-decoration: none;
    }
    .piece.hero { min-height: 88svh; }
    .piece iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      pointer-events: none;
    }
    .copy {
      position: absolute;
      left: 5%;
      bottom: 9%;
      z-index: 2;
      max-width: 22rem;
      text-shadow: 0 1px 10px rgba(255, 255, 255, 0.72);
    }
    h1 {
      font-size: 56px;
      font-weight: 600;
      line-height: 1.05;
    }
    h2 {
      font-size: 32px;
      font-weight: 500;
      line-height: 1.15;
    }
    nav {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }
    nav a {
      color: #c23b22;
      font: 15px/1 "Microsoft YaHei", sans-serif;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      padding-bottom: 3px;
    }
    nav a:hover { color: #163027; }
    .piece:not(.hero) h2 {
      color: #163027;
    }
    .piece:not(.hero)::after {
      content: "";
      position: absolute;
      inset: 0;
    }
    @media (max-width: 700px) {
      h1 { font-size: 40px; }
      h2 { font-size: 26px; }
      .copy { left: 6%; right: 6%; max-width: none; }
    }
  </style>
</head>
<body>
  <section class="piece hero">
    <iframe src="./coast.html?embed=1" title="鹈鹕的海岸骑行" tabindex="-1"></iframe>
    <div class="copy">
      <h1>鹈鹕合集</h1>
      <nav>
        <a href="./coast.html">海岸骑行</a>
        <a href="./wander.html">漫游记</a>
        <a href="./wind.html">破风骑行</a>
      </nav>
    </div>
  </section>
  <a class="piece" href="./wander.html">
    <iframe src="./wander.html?embed=1" title="鹈鹕漫游记" tabindex="-1"></iframe>
    <div class="copy"><h2>漫游记</h2></div>
  </a>
  <a class="piece" href="./wind.html">
    <iframe src="./wind.html?embed=1" title="鹈鹕破风骑行" tabindex="-1"></iframe>
    <div class="copy"><h2>破风骑行</h2></div>
  </a>
</body>
</html>
