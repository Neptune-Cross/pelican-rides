<script>
const ns='http://www.w3.org/2000/svg';
const el=id=>document.getElementById(id);
const road=el('road'), plants=el('plants');
for(let i=0;i<9;i++){const p=document.createElementNS(ns,'path');p.setAttribute('d',`M${i*180} 596h65`);road.appendChild(p);}
for(let i=0;i<7;i++){const p=document.createElementNS(ns,'use');p.setAttribute('href','#plant');plants.appendChild(p);}
let running=!matchMedia('(prefers-reduced-motion: reduce)').matches,time=0,last=null;
const button=el('pause');
function sync(){button.textContent=running?'Ⅱ':'▷';button.title=running?'暂停动画':'播放动画';button.setAttribute('aria-label',button.title);}
button.addEventListener('click',()=>{running=!running;sync();});sync();
function draw(){
 const a=time*3.7, bob=Math.sin(a*2)*2;
 el('rider').setAttribute('transform',`translate(0 ${bob})`);
 el('rear').setAttribute('transform',`rotate(${a*180/Math.PI})`);
 el('front').setAttribute('transform',`rotate(${a*180/Math.PI})`);
 const x=591+29*Math.cos(a),y=499+29*Math.sin(a),fx=1182-x,fy=998-y;
 el('crank').setAttribute('d',`M${fx} ${fy}L${x} ${y}m-11 0h22M${fx-11} ${fy}h22`);
 // 用两段腿部折线连接髋部和旋转脚踏，保持脚掌始终跟随踏板。
 el('nearLeg').setAttribute('d',`M550 345Q${580+15*Math.cos(a)} 388 ${557+18*Math.cos(a)} 413L${x} ${y-6}`);
 el('farLeg').setAttribute('d',`M531 345Q${552-15*Math.cos(a)} 394 ${542-18*Math.cos(a)} 420L${fx} ${fy-6}`);
 el('foot').setAttribute('d',`M${x-9} ${y-5}h23`);
 el('scarf').setAttribute('d',`M613 229Q577 ${210+Math.sin(a*1.4)*7} 543 ${225+Math.sin(a*1.4+1)*8}l8 10-12 9q35-13 72 0`);
 road.setAttribute('transform',`translate(${-time*140%180} 0)`);
 [...plants.children].forEach((p,i)=>p.setAttribute('transform',`translate(${((i*240-time*140)%1680+1680)%1680-120} ${i%2?690:515}) scale(${i%2?1:.6})`));
 el('clouds').setAttribute('transform',`translate(${-time*7%1300} 0)`);
}
function frame(now){if(last!==null&&running)time+=Math.min((now-last)/1000,.05)*Number(el('speed').value);last=now;draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
