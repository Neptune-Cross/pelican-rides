<footer><span>海岸漫游 / 01</span><div class="controls"><button id="pause" title="暂停动画" aria-label="暂停动画">Ⅱ</button><label for="speed">骑行速度 <input id="speed" type="range" min="0.4" max="2" step="0.1" value="1"></label></div></footer>
<script>
const scene=document.querySelector('#scene');
const pause=document.querySelector('#pause');
const speed=document.querySelector('#speed');
// 展开车轮实例，使内部辐条的暂停和调速与整幅动画保持一致。
scene.querySelectorAll('#bicycle > use').forEach(instance=>{
 const wheel=document.createElementNS('http://www.w3.org/2000/svg','g');
 wheel.setAttribute('transform',`translate(${instance.getAttribute('x')} ${instance.getAttribute('y')})`);
 document.querySelector('#wheel').childNodes.forEach(child=>wheel.append(child.cloneNode(true)));
 instance.replaceWith(wheel);
});
let paused=false,rate=1,phase=0,last=0;
const parts=Object.fromEntries(['farLeg','nearThigh','nearLeg','foot','crank','pedal'].map(id=>[id,document.getElementById(id)]));
pause.addEventListener('click',()=>{paused=!paused;scene.classList.toggle('paused',paused);pause.textContent=paused?'▶':'Ⅱ';pause.title=paused?'继续动画':'暂停动画';pause.setAttribute('aria-label',pause.title);});
speed.addEventListener('input',()=>{rate=Number(speed.value);scene.getAnimations({subtree:true}).forEach(animation=>animation.updatePlaybackRate(rate));});
function frame(time){
 const dt=last?Math.min(time-last,50):0;last=time;
 if(!paused){
  phase+=dt/1300*Math.PI*2*rate;
  const x=600+26*Math.cos(phase),y=474+26*Math.sin(phase),fx=1200-x,fy=948-y;
  const kx=535+9*Math.cos(phase),ky=427+7*Math.sin(phase);
  parts.nearThigh.setAttribute('d',`M561 389L${kx} ${ky}`);
  parts.nearLeg.setAttribute('d',`M${kx} ${ky}L${x} ${y}`);
  parts.farLeg.setAttribute('d',`M563 424L${fx} ${fy}`);
  parts.foot.setAttribute('d',`M${x-12} ${y}H${x+12}L${x+20} ${y+7}H${x-7}Z`);
  parts.crank.setAttribute('d',`M${x} ${y+5}L600 474L${fx} ${fy+5}`);
  parts.pedal.setAttribute('d',`M${x-12} ${y+8}H${x+12}`);
 }
 requestAnimationFrame(frame);
}
if(matchMedia('(prefers-reduced-motion: reduce)').matches)pause.click();
requestAnimationFrame(frame);
</script>
